<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00695c">
  <meta name="description" content="Catálogo y pedidos por WhatsApp">
  <title>Tienda virtual</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #00695c;
      --accent: #ffb300;
      --ink: #1b2422;
      --muted: #64716e;
      --surface: #ffffff;
      --background: #f4f7f6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--background); }
    a { color: inherit; }
    .hero {
      background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 76%, #111));
      color: white;
      padding: 38px 20px 34px;
    }
    .hero-inner, main, footer { width: min(1120px, 100% - 32px); margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .logo {
      width: 76px; height: 76px; flex: 0 0 76px; object-fit: contain;
      border-radius: 20px; background: white; padding: 7px;
    }
    .brand h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.5rem); line-height: 1.15; }
    .brand p { margin: 8px 0 0; color: rgb(255 255 255 / 84%); }
    .hero-link {
      display: inline-flex; margin-top: 22px; padding: 11px 16px; border-radius: 999px;
      background: var(--accent); color: #17211f; font-weight: 750; text-decoration: none;
    }
    main { padding: 30px 0 48px; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    .search {
      width: 100%; padding: 13px 15px; border: 1px solid #dce5e2; border-radius: 14px;
      background: white; color: var(--ink); font: inherit; outline-color: var(--primary);
    }
    .count { color: var(--muted); white-space: nowrap; font-size: .9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 18px; }
    .card {
      overflow: hidden; border: 1px solid #e4ebe8; border-radius: 20px;
      background: var(--surface); box-shadow: 0 5px 20px rgb(22 48 40 / 5%);
    }
    .product-image { display: block; width: 100%; height: 200px; object-fit: cover; background: #eaf0ee; }
    .image-placeholder { height: 200px; display: grid; place-items: center; color: var(--muted); background: #eaf0ee; }
    .card-content { padding: 16px; }
    .category { margin: 0 0 6px; color: var(--primary); font-size: .78rem; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .card h2 { margin: 0; font-size: 1.12rem; }
    .description { min-height: 40px; margin: 8px 0 14px; color: var(--muted); font-size: .92rem; line-height: 1.45; }
    .variant-select {
      width: 100%; margin: 0 0 12px; padding: 10px; border: 1px solid #dce5e2;
      border-radius: 10px; background: white; font: inherit;
    }
    .price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .price { color: var(--primary); font-size: 1.25rem; font-weight: 800; }
    .stock { color: var(--muted); font-size: .82rem; }
    .order {
      display: block; width: 100%; margin-top: 14px; padding: 12px;
      border: 0; border-radius: 12px; background: var(--primary); color: white;
      font: inherit; font-weight: 750; text-align: center; text-decoration: none;
    }
    .order:hover, .hero-link:hover { filter: brightness(.96); }
    .order:focus-visible, .hero-link:focus-visible, .search:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .order.disabled { background: #9aa6a2; pointer-events: none; }
    .state {
      padding: 28px; border: 1px dashed #c9d5d1; border-radius: 18px;
      color: var(--muted); text-align: center; background: white;
    }
    footer { padding: 0 0 28px; color: var(--muted); text-align: center; font-size: .84rem; }
    @media (max-width: 520px) {
      .hero { padding-top: 28px; }
      .logo { width: 60px; height: 60px; flex-basis: 60px; border-radius: 16px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .count { text-align: right; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <img class="logo" id="business-logo" alt="" hidden>
        <div>
          <h1 id="business-name">Tienda virtual</h1>
          <p id="business-slogan"></p>
        </div>
      </div>
      <a class="hero-link" id="whatsapp-link" href="#" hidden>Haz tu pedido por WhatsApp</a>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Buscar productos..." aria-label="Buscar productos">
      <span class="count" id="product-count"></span>
    </div>
    <div class="grid" id="product-grid"></div>
    <div class="state" id="page-state" role="status">Cargando catálogo...</div>
  </main>
  <footer id="updated-at"></footer>
  <script>
    const query = new URLSearchParams(location.search);
    const requestedBusiness = query.get('negocio');
    const grid = document.getElementById('product-grid');
    const state = document.getElementById('page-state');
    const search = document.getElementById('search');
    let products = [];

    function safeImageSource(value) {
      if (typeof value !== 'string') return null;
      if (/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+=*$/.test(value)) return value;
      try {
        const url = new URL(value);
        return url.protocol === 'https:' ? url.href : null;
      } catch {
        return null;
      }
    }

    function formatPrice(amount, currency) {
      try {
        return new Intl.NumberFormat('es', { style: 'currency', currency }).format(amount);
      } catch {
        return `${amount.toFixed(2)} ${currency}`;
      }
    }

    function orderUrl(product, variant) {
      const business = window.storeBusiness;
      const variantLabel = variant ? Object.values(variant.attributes || {}).join(' · ') : '';
      const price = variant ? variant.price : product.price;
      const text = [
        `Hola, quiero pedir ${product.name}${variantLabel ? ` (${variantLabel})` : ''}.`,
        `Precio: ${formatPrice(price, product.currencyCode || 'USD')}`,
        `Tienda: ${business.name}`
      ].join('\n');
      return `https://wa.me/${business.whatsapp}?text=${encodeURIComponent(text)}`;
    }

    function createProductCard(product) {
      const card = document.createElement('article');
      card.className = 'card';
      const imageSource = safeImageSource(product.image);
      if (imageSource) {
        const image = document.createElement('img');
        image.className = 'product-image';
        image.src = imageSource;
        image.alt = product.name;
        image.loading = 'lazy';
        card.append(image);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'image-placeholder';
        placeholder.textContent = 'Sin imagen';
        card.append(placeholder);
      }

      const content = document.createElement('div');
      content.className = 'card-content';
      if (product.category) {
        const category = document.createElement('p');
        category.className = 'category';
        category.textContent = product.category;
        content.append(category);
      }
      const name = document.createElement('h2');
      name.textContent = product.name;
      content.append(name);
      const description = document.createElement('p');
      description.className = 'description';
      description.textContent = product.description || '';
      content.append(description);

      const variants = Array.isArray(product.variants) ? product.variants : [];
      let selectedVariant = variants[0] || null;
      if (variants.length) {
        const select = document.createElement('select');
        select.className = 'variant-select';
        select.setAttribute('aria-label', `Variación de ${product.name}`);
        variants.forEach((variant, index) => {
          const option = document.createElement('option');
          option.value = String(index);
          option.textContent = Object.entries(variant.attributes || {})
            .map(([key, value]) => `${key}: ${value}`).join(' · ') || `Opción ${index + 1}`;
          select.append(option);
        });
        select.addEventListener('change', () => {
          selectedVariant = variants[Number(select.value)] || null;
          updateAvailability();
        });
        content.append(select);
      }

      const priceRow = document.createElement('div');
      priceRow.className = 'price-row';
      const price = document.createElement('span');
      price.className = 'price';
      const stock = document.createElement('span');
      stock.className = 'stock';
      priceRow.append(price, stock);
      content.append(priceRow);
      const order = document.createElement('a');
      order.className = 'order';
      order.textContent = 'Pedir por WhatsApp';
      order.target = '_blank';
      order.rel = 'noopener noreferrer';
      content.append(order);
      card.append(content);

      function updateAvailability() {
        const amount = selectedVariant ? selectedVariant.price : product.price;
        const available = selectedVariant ? selectedVariant.stock : product.stock;
        price.textContent = formatPrice(amount, product.currencyCode || 'USD');
        stock.textContent = available > 0 ? `${available} disponibles` : 'Agotado';
        order.href = orderUrl(product, selectedVariant);
        order.classList.toggle('disabled', available <= 0);
        order.setAttribute('aria-disabled', String(available <= 0));
      }
      updateAvailability();
      return card;
    }

    function renderProducts() {
      const term = search.value.trim().toLocaleLowerCase('es');
      const matching = products.filter((product) =>
        `${product.name} ${product.category || ''} ${product.description || ''}`
          .toLocaleLowerCase('es').includes(term));
      grid.replaceChildren(...matching.map(createProductCard));
      document.getElementById('product-count').textContent =
        `${matching.length} ${matching.length === 1 ? 'producto' : 'productos'}`;
      state.hidden = matching.length > 0;
      state.textContent = products.length
        ? 'No se encontraron productos.'
        : 'Esta tienda todavía no tiene productos publicados.';
    }

    async function loadStore() {
      if (!requestedBusiness) throw new Error('Falta el identificador de la tienda en el enlace.');
      const response = await fetch(`./productos.json?actualizado=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`No se pudo cargar el catálogo (HTTP ${response.status}).`);
      const catalog = await response.json();
      if (catalog.schemaVersion !== 1 || !catalog.business || !Array.isArray(catalog.products)) {
        throw new Error('El catálogo publicado tiene un formato no compatible.');
      }
      if (catalog.business.id !== requestedBusiness) {
        throw new Error('El enlace no corresponde a esta tienda.');
      }

      const business = catalog.business;
      window.storeBusiness = business;
      document.title = business.name || 'Tienda virtual';
      document.getElementById('business-name').textContent = business.name || 'Tienda virtual';
      document.getElementById('business-slogan').textContent = business.slogan || '';
      const primary = business.colors?.primary;
      const accent = business.colors?.accent;
      if (/^#[0-9a-f]{6}$/i.test(primary || '')) document.documentElement.style.setProperty('--primary', primary);
      if (/^#[0-9a-f]{6}$/i.test(accent || '')) document.documentElement.style.setProperty('--accent', accent);

      const logo = safeImageSource(business.logo);
      if (logo) {
        const image = document.getElementById('business-logo');
        image.src = logo;
        image.alt = `Logotipo de ${business.name}`;
        image.hidden = false;
      }
      if (/^\d{8,15}$/.test(business.whatsapp || '')) {
        const whatsapp = document.getElementById('whatsapp-link');
        whatsapp.href = `https://wa.me/${business.whatsapp}`;
        whatsapp.hidden = false;
      }
      products = catalog.products.filter((product) =>
        product && typeof product.name === 'string' &&
        typeof product.price === 'number' && Number.isFinite(product.price));
      renderProducts();
      if (catalog.updatedAt) {
        const date = new Date(catalog.updatedAt);
        if (!Number.isNaN(date.getTime())) {
          document.getElementById('updated-at').textContent =
            `Catálogo actualizado ${new Intl.DateTimeFormat('es').format(date)}`;
        }
      }
    }

    search.addEventListener('input', renderProducts);
    loadStore().catch((error) => {
      state.hidden = false;
      state.textContent = error.message || 'No se pudo cargar la tienda.';
      grid.replaceChildren();
    });
  </script>
</body>
</html>
