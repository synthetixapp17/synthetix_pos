name = "synthetix-pos"
main = "index.js"
compatibility_date = "2026-11-15"

[vars]
APP_ORIGIN = "https://synthetixapp17.github.io"
APP_TEMPLATE_URL = "https://synthetixapp17.github.io/synthetix_pos/tienda.html"
APP_RESTAURANT_TEMPLATE_URL = "https://synthetixapp17.github.io/synthetix_pos/restaurant_menu.html"
GITHUB_OWNER = "synthetixapp17"

[[kv_namespaces]]
binding = "STORE_CONFIGS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[unsafe.bindings]]
name = "PUBLISH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
